name: Extract Metrics & Send Status Report

# Corre cada viernes a las 9:00 AM (zona UTC)
on:
  schedule:
    - cron: '0 9 * * FRI'
  # Permite ejecutar manualmente desde la UI
  workflow_dispatch:

jobs:
  extract_and_report:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      # PASO 1: Extraer métricas de Jira → Google Sheets
      - name: Extract metrics from Jira
        env:
          JIRA_DOMAIN: ${{ secrets.JIRA_DOMAIN }}
          JIRA_PROJECT_KEY: ${{ secrets.JIRA_PROJECT_KEY }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: |
          python extract_metrics.py
      
      - name: Wait 30 seconds (para que Google Sheet actualice)
        run: sleep 30
      
      # PASO 2: Generar reporte y enviar email
      - name: Generate status report with Rovo Agent
        env:
          GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: |
          python send_status_report.py
      
      - name: Notify on success
        if: success()
        run: |
          echo "✅ Métricas extraídas y reporte enviado exitosamente"
      
      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Error en la extracción o envío de reporte"
